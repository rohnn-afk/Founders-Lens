components:
  securitySchemes:
    ClerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified Clerk session token, never a user-controlled internal owner ID
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  path:
                    type: string
                  reason:
                    type: string
                required:
                - path
                - reason
          required:
          - code
          - message
          - requestId
          - retryable
      required:
      - error
    Pagination:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
      required:
      - nextCursor
      - hasMore
    UserAccount:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - DELETING
        preferences:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - preferences
      - createdAt
    Idea:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title:
          type: string
          maxLength: 200
        summary:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - DELETING
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - title
      - status
      - version
      - createdAt
      - updatedAt
    Conversation:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        ideaId: *id001
        title:
          type:
          - string
          - 'null'
          maxLength: 200
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        proactiveResearch:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - ideaId
      - status
      - proactiveResearch
    Message:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        conversationId: *id001
        sequence:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
          - USER
          - ASSISTANT
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - conversationId
      - sequence
      - role
      - content
      - createdAt
    Generation:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - FAILED
          - CANCELLED
          - INTERRUPTED
        triggerMessageId: *id001
        selected:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - status
      - triggerMessageId
      - selected
    MessageSubmission:
      type: object
      additionalProperties: false
      properties:
        message:
          $ref: '#/components/schemas/Message'
        generation:
          $ref: '#/components/schemas/Generation'
