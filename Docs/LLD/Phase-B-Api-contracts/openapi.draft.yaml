openapi: 3.1.0
info:
  title: Founder's Lens API
  version: 0.2.0-draft
  description: Phase 2B design contract. Not an implemented or validated server. Streaming grammar and exact
    runtime lifecycle remain Phase 2C gates.
servers:
- url: https://api.example.invalid/api/v1
  description: Illustrative hostname only; replace before deployment
security:
- ClerkSession: []
tags:
- name: Identity
- name: Ideas
- name: Conversation
- name: Memory
- name: Experiments
- name: Research
- name: Documents
