      description: "Raw bytes verified by pinned Clerk Express verifyWebhook before JSON use. svix-id dedupe is durable; same event ID/different body 409. Allowlisted user.created/user.updated/user.deleted; no webhook provisioning/reactivation. user.deleted gates/tombstones in same acceptance transaction. 204 after inbox+outbox commit, 503 rollback/transient DB. Security design section 16 governs."
