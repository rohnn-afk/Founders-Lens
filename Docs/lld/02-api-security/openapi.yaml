                type: object
                additionalProperties: false
                properties:
                  path:
                    type: string
                  reason:
                    type: string
                required:
                  - path
                  - reason
          required:
            - code
            - message
            - requestId
            - retryable
      required:
        - error
    Pagination:
      type: object
