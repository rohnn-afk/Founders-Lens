      - page
    SnapshotContent:
      type: object
      additionalProperties: false
      description: "Version-1 typed content under owner-approved immutable/versioned snapshot policy P2D-P05; presentation is a technical default. Source metadata is server-projected/validated against same-idea evidence, never trusted client assertions. Approval freezes embedded citations. Global body cap applies."
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        documentDate:
          type: string
          format: date
        sections:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                maxLength: 64
              heading:
                type: string
                maxLength: 200
              text:
                type: string
                maxLength: 10000
              knowledgeClass:
                type: string
                enum:
                  - CONFIRMED_MEMORY
                  - ASSUMPTION
                  - EXTERNAL_EVIDENCE
                  - USER_OBSERVATION
                  - INTERPRETATION
                  - UNKNOWN
              sourceEvidenceIds:
                type: array
                maxItems: 50
                uniqueItems: true
                items:
                  type: string
                  format: uuid
              missingInformation:
                type: array
                maxItems: 20
                items:
                  type: string
                  maxLength: 500
              sourceReferences:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/SourceReference"
            required:
              - id
              - heading
              - text
              - knowledgeClass
              - sourceEvidenceIds
              - missingInformation
              - sourceReferences
            allOf:
              - if:
                  properties:
                    knowledgeClass:
                      const: EXTERNAL_EVIDENCE
                  required:
                    - knowledgeClass
                then:
                  properties:
                    sourceEvidenceIds:
                      minItems: 1
                    sourceReferences:
                      minItems: 1
      required:
        - title
        - documentDate
        - sections
    SourceReference:
      type: object
      additionalProperties: false
      properties:
        evidenceId:
          type: string
          format: uuid
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        sourceTitle:
          type:
            - string
            - "null"
        sourcePublisher:
          type:
            - string
            - "null"
        retrievedAt:
          type:
            - string
            - "null"
          format: date-time
        sourceObservedAt:
          type:
            - string
            - "null"
          format: date-time
        geography:
          type:
            - string
            - "null"
        periodStart:
          type:
            - string
            - "null"
          format: date
        periodEnd:
          type:
            - string
            - "null"
          format: date
        trust:
          type: string
          enum:
            - UNASSESSED
            - SOURCE_CHECKED
            - CONTESTED
            - STALE
            - OUT_OF_SCOPE
            - UNVERIFIABLE
        limitations:
          type:
            - string
            - "null"
      required:
        - evidenceId
        - sourceUrl
        - sourceTitle
        - sourcePublisher
        - retrievedAt
        - sourceObservedAt
        - geography
        - periodStart
        - periodEnd
        - trust
        - limitations
  responses:
    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "403":
      description: Action forbidden for accessible resource or inactive local account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Not found or not owned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "406":
      description: Accept must allow text/event-stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "409":
      description: Business state or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "412":
      description: Stale entity version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "413":
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "415":
      description: Unsupported content type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "428":
      description: Required If-Match missing
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "429":
      description: Rate or quota limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Optional bounded delay in seconds when retry time is known; never promises quota reset.
          schema:
            type: integer
            minimum: 1
    "500":
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Optional bounded delay in seconds when retry time is known; never promises quota reset.
          schema:
            type: integer
            minimum: 1
