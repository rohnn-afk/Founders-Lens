openapi: 3.1.0
info:
  title: Founder's Lens API
  version: 0.2.0-draft
  description: Phase 2D final closure proposal. Human contracts govern; five core product decisions approved; deployment settings and implementation validation remain pending.
x-pdf-export-limits:
  description: Engineering defaults under approved P2D-P05; runtime validation pending.
  canonicalContentMaxBytes: 1048576
  pdfMaxBytes: 10485760
  renderDeadlineSeconds: 60
  maxActiveJobsPerAccount: 2
  downloadGrantTtlSeconds: 300
servers:
- url: https://api.example.invalid
  description: Illustrative hostname only; replace before deployment
security:
- ClerkSession: []
tags:
- name: Identity
- name: Ideas
- name: Conversation
- name: Memory
- name: Experiments
- name: Research
- name: Documents
paths:
  /api/v1/me:
    get:
      tags:
        - Identity
      summary: Read own account
      operationId: getMe
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "400":
