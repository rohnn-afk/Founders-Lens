openapi: 3.1.0
x-p5-am01-deletion-admission:
  status: Approved documentation/design amendment only
  appliesTo: POST /api/v1/me/data-operations deletion kinds only
  prerequisite: Verified durable independent scope/incarnation-bound intent before primary deletion commit
  accepted202: Primary lifecycle/DataOperation/idempotency/outbox commit, never intent alone
  unavailable503: Independent authority failure or uncertain outcome; no acceptance claim or automatic new-key resend
  recovery: Unresolved suppression blocks private access; authoritative coverage before restore reopening
  compatibility: Existing DTOs/routes and lifecycle enums retained; stronger availability/freshness dependency; runtime proof pending
info:
  title: "Founder's Lens API"
  version: 0.5.0
  description: P4-B01/B02 mapping design and Phase4 package explicitly approved under FE4D-A08,FL-P4-0.5-approved;0.5.0. Documentation only;runtime/provider/security/accessibility/model gates pending. Legacy fresh experiment creates reject missing hypothesis;historical accepted replay preserved. Explicit projection3 anddurable LearningEvidence capture are design artifacts,not executed migrations.
x-pdf-export-limits:
  description: Engineering defaults under approved P2D-P05; runtime validation pending.
  canonicalContentMaxBytes: 1048576
  pdfMaxBytes: 10485760
  renderDeadlineSeconds: 60
  maxActiveJobsPerAccount: 2
  downloadGrantTtlSeconds: 300
