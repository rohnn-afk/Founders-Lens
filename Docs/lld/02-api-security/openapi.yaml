            type: string
            pattern: "^\"v[1-9][0-9]*\"$"
  /api/v1/me/data-operations:
    post:
      tags:
        - Identity
      summary: Request personal data export or deletion
      operationId: postMeDataOperations
      responses:
        "202":
          description: Accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataOperation"
          headers:
            Location:
              description: Relative URL of durable status resource
              schema:
                type: string
                format: uri-reference
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      description: "Strict conditional deletion/export request. Deletion requires confirmed=true, policyVersion, verified fresh auth (proposed 5min); 409 POLICY_NOT_ACTIVE for unconfigured/inactive policy; core p2d-privacy-v2 approved. Idempotency-Key original 202 replay; domain deletion scope unique beyond ledger TTL."
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Opaque client-generated stable operation key; same key and different payload is 409
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataOperationCreate"
  /api/v1/me/data-operations/{operationId}:
    get:
      tags:
        - Identity
      summary: Read own data-operation status
      operationId: getMeDataOperationsOperationId
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataOperation"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          $ref: "#/components/responses/409"
        "412":
          $ref: "#/components/responses/412"
        "413":
          $ref: "#/components/responses/413"
        "415":
          $ref: "#/components/responses/415"
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      description: "Deletion progress only may be read by a matching verified subject when local account is blocked; no content/download. COMPLETED deletion means live purge with disclosed backup residual. EXPORT download minted only for active owner and AVAILABLE archive. Matching verified subject may read minimal deletion progress/replay only while local account blocked; no content, provisioning or download exception. Provider-revoked sessions may no longer authenticate."
      parameters:
        - in: path
          name: operationId
          required: true
          schema:
            type: string
            format: uuid
