        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
        "503":
          $ref: "#/components/responses/503"
      description: Requires valid Clerk session and resource-level authorization. Other-owner resource IDs yield privacy-preserving 404. Provider and database failures must not produce partial authorization bypasses.
