# Local synthetic-data infrastructure only; no application schema or jobs.
# Use --env-file .env.infrastructure. Never print resolved config with secrets.
name: founders-lens-local

services:
  postgres:
    image: docker.io/library/postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.infrastructure}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.infrastructure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random development POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - target: 5432
        published: "${POSTGRES_PORT:-55432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [loopback]
    healthcheck:
      test: [CMD-SHELL, "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -w -Atc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 30
    stop_grace_period: 30s
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  redis:
    image: docker.io/library/redis:7.4.12-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a random development REDIS_PASSWORD}
    # Keep the password out of arguments; the private config is container-local.
    command:
      - sh
      - -ec
      - |
        umask 077
        printf 'dir /data\nappendonly yes\nappendfsync everysec\nmaxmemory-policy noeviction\nprotected-mode yes\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/founders-lens-redis.conf
        exec redis-server /tmp/founders-lens-redis.conf
    ports:
      - target: 6379
        published: "${REDIS_PORT:-56379}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - redis-data:/data
    networks: [loopback]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning -h 127.0.0.1 ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    stop_grace_period: 30s
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  redis-data:

networks:
  loopback:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
