name: API image

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke-test the API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/build-api-image.sh "$GITHUB_SHA" founders-lens-api:ci
      - run: bash scripts/smoke-api-image.sh founders-lens-api:ci "$GITHUB_SHA"
