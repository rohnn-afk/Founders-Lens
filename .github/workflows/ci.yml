name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' }}

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned npm version
        run: npm install --global "npm@$(node -p 'require("./package.json").packageManager.slice(4)')" --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check-toolchain
      - run: npm run lint
      - run: npm run db:validate
      - run: npm run typecheck
      - name: Run tests and validate the OpenAPI 3.1 document
        run: npm test
      - name: Verify the dependency-free public demo
        env:
          FL_PUBLIC_DEMO: 'true'
        run: |
          node scripts/next.mjs build --webpack
          node --test tests/public-demo.integration.mjs
      - name: Pull disposable generation fixtures
        run: |
          docker pull docker.io/library/postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
          docker pull docker.io/library/redis:7.4.12-bookworm@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
      - name: PostgreSQL and independent authority
        run: node tests/p6-runtime-recovery-clearance.test.mjs --p6-runtime-recovery-live
      - name: Authority mailbox privilege and lifecycle checks
        run: node tests/suppression-ledger.test.mjs --suppression-live
      - name: PostgreSQL, independent authority, and Redis pipeline
        run: node tests/m05-local-generation.test.mjs --live

  security:
    name: Secret and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Scan source and incoming history
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner .
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="$BASE..HEAD" .
          fi
  image:
    name: Build and smoke-test the API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/build-api-image.sh "$GITHUB_SHA" founders-lens-api:ci
      - run: bash scripts/smoke-api-image.sh founders-lens-api:ci "$GITHUB_SHA"
      - name: Save tested image
        run: |
          mkdir release
          docker image inspect --format '{{.Id}}' founders-lens-api:ci > release/index-digest
          docker save --output release/api.tar founders-lens-api:ci
      - name: Scan image filesystem and configuration
        run: bash scripts/scan-api-image.sh
      - name: Preserve scan diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-image-scan
          path: release/scan-summary.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging'
        with:
          name: tested-api-image
          path: |
            release/api.tar
            release/index-digest
          compression-level: 0
          retention-days: 2

  release:
    name: Publish and deploy staging API
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging' && vars.FL_STAGING_RELEASE_ENABLED == 'true'
    needs: [validate, security, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: founders-lens-staging-api
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tested-api-image
          path: release
      - name: Verify staging tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Publish tested image and verify registry manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-staging-image.sh
      - name: Preserve promotion scan diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-api-promotion-scan
          path: release/scan-summary.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staging-api-release
          path: release/manifest.json
      - name: Deploy exact image and smoke-test the API
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_API_SERVICE_ID: ${{ vars.RENDER_STAGING_API_SERVICE_ID }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq .object.sha)" = "$GITHUB_SHA"
          node -e 'const r = require("./release/scan-summary.json"); if (r.vulnerabilities.some(v => v.accepted) && !(Date.now() < Date.parse(r.exceptionExpiresAt))) process.exit(1)'
          node scripts/render-deploy-staging.mjs release/manifest.json
